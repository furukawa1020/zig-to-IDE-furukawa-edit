name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Zig-generated site
    runs-on: windows-latest
    env:
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN || github.token }}

      - name: Download pinned Zig
        shell: pwsh
        run: |
          $archive = "zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $uri = "https://ziglang.org/download/$env:ZIG_VERSION/$archive"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:ZIG_SHA256) {
            throw "Zig archive SHA-256 mismatch: expected $env:ZIG_SHA256, got $actual"
          }
          Expand-Archive -Path $archive -DestinationPath .zig-toolchain
          $zigDir = Join-Path $PWD ".zig-toolchain\zig-x86_64-windows-$env:ZIG_VERSION"
          $zigDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test
        run: zig build test --cache-dir .zig-cache --global-cache-dir .zig-global-cache

      - name: Build release artifacts
        run: |
          zig build install --cache-dir .zig-cache --global-cache-dir .zig-global-cache
          zig build install-gui --cache-dir .zig-cache --global-cache-dir .zig-global-cache
          zig build install-linux --cache-dir .zig-cache --global-cache-dir .zig-global-cache

      - name: Bundle and verify release
        run: |
          .\zig-out\bin\zide.exe command release.bundle
          .\zig-out\bin\zide.exe command release.verify

      - name: Generate site
        run: zig build site --cache-dir .zig-cache --global-cache-dir .zig-global-cache

      - name: Capture Open Graph screenshot
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $browserCandidates = @(
            (Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"),
            (Join-Path $env:ProgramFiles "Microsoft\Edge\Application\msedge.exe")
          )
          if ($programFilesX86) {
            $browserCandidates += Join-Path $programFilesX86 "Microsoft\Edge\Application\msedge.exe"
          }
          $browser = $browserCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) {
            throw "Chrome or Edge is required to capture the Open Graph screenshot."
          }
          $indexPath = (Resolve-Path ".\zig-out\site\index.html").Path
          $indexUri = [System.Uri]::new($indexPath).AbsoluteUri
          $siteDir = (Resolve-Path ".\zig-out\site").Path
          $screenshotPath = Join-Path $siteDir "ogp.png"
          & $browser --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 "--screenshot=$screenshotPath" $indexUri
          $captureExitCode = $LASTEXITCODE
          if (($null -ne $captureExitCode) -and ($captureExitCode -ne 0)) {
            throw "Open Graph screenshot capture failed with exit code $captureExitCode."
          }
          if (-not (Test-Path $screenshotPath)) {
            throw "Open Graph screenshot was not created."
          }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: zig-out/site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
